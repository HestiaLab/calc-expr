name: 持续集成

on:
  push:
    branches: [main, master, 'feature/**', 'fix/**', 'refactor/**', 'infra/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        preset: [ninja-debug, ninja-release]
        include:
          - os: ubuntu-latest
            preset: ninja-debug
            compiler: clang
          - os: ubuntu-latest
            preset: ninja-shared
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: 安装 Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: 配置 MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: 配置 Clang
        if: matrix.compiler == 'clang'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: 配置
        run: cmake --preset ${{ matrix.preset }}

      - name: 构建
        run: cmake --build --preset ${{ matrix.preset }}

      - name: 测试
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: 配置
        run: cmake --preset ninja-asan

      - name: 构建
        run: cmake --build --preset ninja-asan

      - name: 测试
        run: ctest --preset ninja-asan --output-on-failure

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: 配置
        run: cmake --preset ninja-coverage

      - name: 构建
        run: cmake --build --preset ninja-coverage

      - name: 测试
        run: ctest --preset ninja-coverage --output-on-failure

  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            library: static
            preset: ninja-release
            config: Release
          - os: ubuntu-latest
            library: shared
            preset: ninja-shared
            config: Debug
          - os: macos-latest
            library: static
            preset: ninja-release
            config: Release
          - os: windows-latest
            library: static
            preset: ninja-release
            config: Release
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: 安装 Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: 配置 MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: 配置打包构建
        run: cmake --preset ${{ matrix.preset }}

      - name: 构建安装包
        run: cmake --build --preset ${{ matrix.preset }}

      - name: 安装到临时前缀
        run: cmake --install build/${{ matrix.preset }} --config ${{ matrix.config }} --prefix install

      - name: 配置包消费冒烟
        run: >
          cmake
          -G Ninja
          -S tests/package_smoke
          -B build/package-smoke-${{ matrix.library }}
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install

      - name: 构建包消费冒烟
        run: cmake --build build/package-smoke-${{ matrix.library }} --config ${{ matrix.config }}

      - name: 测试包消费冒烟
        run: >
          ctest
          --test-dir build/package-smoke-${{ matrix.library }}
          -C ${{ matrix.config }}
          --output-on-failure

  subproject-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: 安装 Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: 配置 MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: 配置子项目冒烟
        run: >
          cmake
          -G Ninja
          -S tests/subproject_smoke
          -B build/subproject-smoke
          -DCALCEXPR_SOURCE_DIR=${{ github.workspace }}

      - name: 构建子项目冒烟
        run: cmake --build build/subproject-smoke --config Debug

      - name: 测试子项目冒烟
        run: ctest --test-dir build/subproject-smoke -C Debug --output-on-failure
